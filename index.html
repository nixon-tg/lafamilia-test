<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La Familia Shop</title>
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="app">
<header class="header">
<img src="assets/logo.png" class="logo" alt="La Familia">
</header>

<section class="card balance-card">
<div class="small">💳 Saldo</div>
<div class="balance">0,00 zł</div>
</section>

<section class="card">
<h2>👋 Witaj w La Familia Shop</h2>
<p>Twój sklep dostępny bezpośrednio w Telegramie.</p>
<div class="divider"></div>
<ul>
<li>Przeglądaj dostępne produkty.</li>
<li>Doładuj saldo z poziomu bota.</li>
<li>Zamawiaj szybko i wygodnie.</li>
</ul>
<p class="choose">Wybierz opcję poniżej:</p>
</section>

<div class="row">
<button id="menuBtn">📁 MENU ></button>
<button id="contactBtn">🎧 KONTAKT ></button>
</div>
</div>
<script src="app.js"></script>
</body>
</html>
