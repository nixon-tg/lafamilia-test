<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>La Familia Shop</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app fade-in">

<header class="logo">
<img src="assets/logo.svg" alt="La Familia Shop" height="42">
</header>

<main id="home-screen">

<section class="card balance">

<div>
<div class="title">Saldo</div>
<div class="value" id="balance">0,00 zł</div>
</div>

<img class="icon"
src="assets/icons/wallet.svg"
alt="Wallet">

</section>


<section class="card">

<h2>Witaj w La Familia Shop</h2>

<div class="info-row">
<img class="icon" src="assets/icons/cart.svg">
<p>Twój sklep dostępny bezpośrednio w Telegramie.</p>
</div>

<div class="info-row">
<img class="icon" src="assets/icons/wallet.svg">
<p>Doładuj saldo wyłącznie z poziomu bota Telegram.</p>
</div>

<div class="info-row">
<img class="icon" src="assets/icons/hand.svg">
<p>Wybierz jedną z opcji poniżej.</p>
</div>

</section>


<section class="tiles">

<a href="#" class="tile" id="open-menu">

<div style="display:flex;align-items:center;gap:12px;">
<img class="icon" src="assets/icons/folder.svg">
<span>MENU</span>
</div>

<img class="icon"
src="assets/icons/arrow-right.svg">

</a>

<a href="#" class="tile" id="open-contact">

<div style="display:flex;align-items:center;gap:12px;">
<img class="icon" src="assets/icons/headset.svg">
<span>KONTAKT</span>
</div>

<img class="icon"
src="assets/icons/arrow-right.svg">

</a>

</section>

</main>



<main id="menu-screen" class="hidden">
<section class="card">
<h2>MENU</h2>
<p>Kontener przygotowany pod ekran SPA.</p>
</section>
</main>


<main id="contact-screen" class="hidden">
<section class="card">
<h2>KONTAKT</h2>
<p>Kontener przygotowany pod ekran kontaktu.</p>
</section>
</main>

</div>

<script src="app.js"></script>

</body>
</html>
