<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Familia Shop</title>
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="container">
  <div class="card balance">
    <div class="label">SALDO</div>
    <div id="balance">0.00 PLN</div>
  </div>

  <div class="card welcome">
    <h2>La Familia Shop</h2>
    <p>Twój sklep dostępny bezpośrednio w Telegramie.</p>
    <p>Saldo doładowujesz wyłącznie przez bota Telegram.</p>
  </div>

  <div class="tiles">
    <button class="tile" id="menuBtn">MENU</button>
    <button class="tile" id="contactBtn">KONTAKT</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
