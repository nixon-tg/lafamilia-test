<!DOCTYPE html>
<html lang="pl"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>La Familia Shop</title>
<link rel="stylesheet" href="style.css">
</head><body>
<div class="app">
<h1>La Familia Shop</h1>

<div class="card balance">
<div class="left">💳 <span>Saldo</span></div>
<div class="amount">0,00 zł</div>
</div>

<div class="card welcome">
<h2>👋 Witaj w La Familia Shop!</h2>
<hr>
<div class="row">🛒<p>Twój sklep dostępny bezpośrednio w Telegramie.</p></div>
<hr>
<div class="row">💳<p>Doładuj saldo w bocie, wybierz produkty i finalizuj zamówienia w kilka chwil.</p></div>
<hr>
<div class="row">👇<p>Wybierz opcję poniżej.</p></div>
</div>

<div class="grid">
<button class="tile">📁 MENU <span>›</span></button>
<button class="tile">🎧 KONTAKT <span>›</span></button>
</div>
</div>
<script src="app.js"></script>
</body></html>
